name: Backend CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: espinargo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Credenciales ficticias: Settings las exige al arrancar, pero en
    # ENVIRONMENT=development los tests no llaman servicios externos reales.
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/espinargo_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/espinargo_db
      REDIS_URL: redis://localhost:6379/0
      TWILIO_ACCOUNT_SID: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      TWILIO_AUTH_TOKEN: ci-twilio-token
      TWILIO_PHONE_NUMBER: "+10000000000"
      RESEND_API_KEY: re_ci_dummy_key
      CLOUDINARY_CLOUD_NAME: ci-cloud
      CLOUDINARY_API_KEY: ci-key
      CLOUDINARY_API_SECRET: ci-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE espinargo_test;"

      - name: Run tests
        # Gate del deploy: suite unitaria (verificada en verde).
        # TODO: incluir tests/integration cuando se reparen los que
        # quedaron desactualizados respecto a los endpoints actuales.
        run: pytest tests/unit --cov=app --cov-report=term-missing

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: backend
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
