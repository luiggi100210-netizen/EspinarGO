name: espinargo_app
description: "App de transporte y encomiendas para Espinar, Cusco"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado y reactividad - Riverpod maneja el estado reactivo
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # HTTP y red - Cliente HTTP avanzado con interceptores
  dio: ^5.4.1
  connectivity_plus: ^5.0.2

  # Almacenamiento local seguro - Tokens JWT cifrados
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Navegación - Rutas declarativas
  go_router: ^13.1.0

  # Mapas y ubicación
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Imágenes - Cache y selección
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Tiempo real - WebSocket nativo (compatible con FastAPI)
  web_socket_channel: ^2.4.0

  # Notificaciones push - Firebase
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.10

  # UI y diseño
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  pinput: ^5.0.0
  country_code_picker: ^3.0.0

  # Utilidades
  intl: ^0.19.0
  permission_handler: ^11.3.0
  url_launcher: ^6.2.4
  package_info_plus: ^9.0.1
  device_info_plus: ^10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_lints: ^3.0.0
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/