plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Flutter pasa los --dart-define a Gradle como lista base64 separada por comas.
// Se extrae GOOGLE_MAPS_API_KEY para inyectarla en el AndroidManifest,
// de modo que la clave tenga una única fuente: el comando de build.
def dartDefines = [GOOGLE_MAPS_API_KEY: '']
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { entry ->
        def pair = new String(entry.decodeBase64(), 'UTF-8').split('=', 2)
        if (pair.length == 2 && dartDefines.containsKey(pair[0])) {
            dartDefines[pair[0]] = pair[1]
        }
    }
}

android {
    namespace = "com.yauritaxi.app"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.yauritaxi.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += dartDefines
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
